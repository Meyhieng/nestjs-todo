type Order {
  id: ID!
  product: String!
  quantity: Int!
}

type Receipt {
  receiptId: ID!
  issuedAt: String!
  name: String!
  price: Float!
}

type Query {
  orders: [Order!]!
  receipts: [Receipt!]!
}

type Mutation {
  createOrder(product: String!, quantity: Int!): Order!
  createReceipt(name: String!, price: Float!, issuedAt: String!): Receipt!
}