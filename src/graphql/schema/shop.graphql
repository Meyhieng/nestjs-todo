type Order {
  id: ID!
  name: String!
  price: Float!
  issuedAt: String!
}

type Receipt {
  id: ID!
  issuedAt: String!
  name: String!
  price: Float!
}

type Query {
  orders: [Order!]!
  receipts: [Receipt!]!
}

type Mutation {
  addOrder(name: String!, price: Float!, issuedAt: String!): Order!
  createReceipt(name: String!, price: Float!, issuedAt: String!): Receipt!
}